<p-card>
  <form>
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" pInputText class="w-full" />
    </div>
    <div class="field">
      <label for="content">Content</label>
      <textarea id="content" pTextarea class="w-full"></textarea>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <p-select inputId="category" class="w-full"
        optionValue="id"
        optionLabel="name"
        [options]="categories()"></p-select>
    </div>
  </form>
</p-card>
