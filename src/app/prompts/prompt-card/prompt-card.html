<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="m-0">{{prompt().title}} par</h3>
      <div class=" text-small text-color-secondary ">@{{prompt().author.username}}</div>
    </div>
    <div class="flex gap-2">
      <p-button icon="pi pi-pencil" size="small" [text]="true"></p-button>
      <p-button icon="pi pi-copy" size="small" (onClick)="copyToClipboard()" [text]="true"></p-button>
    </div>
  </div>

    <textarea pTextarea readonly class="w-full mb-2" rows="8">{{prompt().content}}</textarea>
    <div class="flex justify-content-between align-items-center">
      <p-tag [value]="prompt().category.name" severity="secondary"/>
      <div class="flex gap-2 align-items-center">
        <p-button icon="pi pi-thumbs-up" severity="secondary" size="small"></p-button>
        <span>{{prompt().score}}</span>
        <p-button icon="pi pi-thumbs-down" severity="secondary" size="small"></p-button>
      </div>

    </div>
  </p-card>
