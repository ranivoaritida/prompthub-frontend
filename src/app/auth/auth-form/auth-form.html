<p-card [header]="mode() === 'login' ? 'Connexion' : 'Créer un compte'">
  <form [formGroup]="form">

    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" class="w-full" type="text" formControlName="username" placeholder="Nom d'utilisateur" pInputText />
      <small class="invalid-feedback">Le nom d'utilisateur est requis</small>
    </div>
    <div class="field"></div>
    <label for="password">Mot de passe</label>
      <p-password inputId="password" id="password" class="w-full" inputStyleClass="w-full" formControlName="password"  />
      <small class="invalid-feedback">Le mot de passe est requis (min 4 caractères)</small>
    <div class="flex gap-2 justify-content-end mt-2">
      <p-button (onClick)="toggleMode()" severity="secondary" [label]=" mode() === 'login' ? 'Créer un compte' : 'Se connecter' " />
      <p-button type="submit" [label]=" mode() === 'login' ? 'Connexion' : 'Créer un compte' " />
    </div>
  </form>
</p-card>
